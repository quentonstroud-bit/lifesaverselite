<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080d17"/>

  <!-- Red circle logo -->
  <circle cx="180" cy="315" r="90" fill="#53080E"/>
  <text x="180" y="335" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">LS</text>

  <!-- Brand name -->
  <text x="300" y="295" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">LifeSavers</text>
  <text x="300" y="370" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#53080E" letter-spacing="-1">Elite</text>

  <!-- Tagline -->
  <text x="300" y="430" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#9ca3af" letter-spacing="0">Refer. Earn. Protect Lives.</text>

  <!-- Bottom accent line -->
  <rect x="0" y="610" width="1200" height="20" fill="#53080E"/>
</svg>
